name: Build
on: [push]

permissions:
  contents: read

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}

jobs:
  test:
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Check release configuration and tooling
        run: npm run test-release
      - name: Lint
        run: npm run lint
      - run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-output.log
      - name: Upload test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs
          path: test-output.log
          retention-days: 30
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test-results.xml"
        if: always()
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    environment: release
    runs-on: ubuntu-latest
    needs: test
    # Operator pause switch, not an authorization boundary. Environments still restrict refs.
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # needed for npm trusted publishers with OIDC
    steps:
      - name: Mint a release-branch token
        # Short-lived installation token for helix-rum-release-publisher, the only
        # identity allowed to write release-* branches. Key lives in this environment.
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.publisher.outputs.token }}
          persist-credentials: true
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Publish release
        run: |
          rm -f release-notes.md
          npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}