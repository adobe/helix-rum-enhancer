name: Build
on: [push]

permissions:
  contents: read

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}

jobs:
  test:
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-output.log
      - name: Upload test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs
          path: test-output.log
          retention-days: 30
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test-results.xml"
        if: always()
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    environment: release
    runs-on: ubuntu-latest
    needs: test
    # Operator pause switch, not an authorization boundary. Environments still restrict refs.
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # needed for npm trusted publishers with OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}